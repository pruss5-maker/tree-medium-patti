<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>KELA Oracle Social Reel</title>
    <link rel="stylesheet" href="oracle-social-renderer.css?v=20260824-2" />
  </head>
  <body>
    <main class="social-canvas" data-social-canvas></main>
    <script>
      const requestedDeck = new URLSearchParams(window.location.search).get("deck");
      const deckScript = requestedDeck === "tree"
        ? "tree-oracle.js"
        : requestedDeck === "plant" ? "plant-oracle.js" : "animal-guide.js";
      const dataScript = document.createElement("script");
      dataScript.src = deckScript;
      dataScript.onload = () => {
        const renderer = document.createElement("script");
        renderer.src = "oracle-social-renderer.js?v=20260825-5";
        document.body.append(renderer);
      };
      document.body.append(dataScript);
    </script>
  </body>
</html>
